name: Windows manager
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-build.txt
      - run: python scripts/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: Fallout2-Coop-Manager-Windows
          path: |
            Fallout2-Coop-Manager-v0.1.0-Windows.zip
            SHA256SUMS.txt

